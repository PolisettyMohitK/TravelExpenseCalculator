spring.application.name=travel-expense-calculator
server.port=${PORT:8080}

# Local development: file-based H2 so saved trips survive restarts
spring.datasource.url=jdbc:h2:file:./data/trips
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}
